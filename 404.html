<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada · Memória</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/img/logo-simbolo.svg">
<style>
  :root{--fundo:#F7EFE6;--texto:#2A211C;--suave:#6B5B4E;--acento:#B5541C}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--fundo);color:var(--texto);
       font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px 16px;text-align:center}
  main{max-width:420px}
  img{width:72px;height:auto}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:32px;line-height:1.2;margin:18px 0 8px}
  p{color:var(--suave);margin:0 0 24px}
  a{display:inline-block;min-height:44px;padding:11px 22px;border-radius:999px;background:var(--texto);color:var(--fundo);
    text-decoration:none;font-weight:500}
  a:focus-visible{outline:3px solid var(--acento);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/assets/img/logo-simbolo.svg" alt="" width="72" height="41">
  <h1>Esta página não existe</h1>
  <p>O endereço pode estar incompleto ou o link já não estar activo. Se recebeu um QR Code de um evento, peça um novo à organização.</p>
  <a href="/">Ir para a página inicial</a>
</main>
</body>
</html>
